<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123d2a">
  <title>{% block title %}LeafLens · Plant health, made clear{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}" aria-label="LeafLens home">
      <span class="brand-mark" aria-hidden="true">⌁</span>
      <span>LeafLens</span>
    </a>
    <span class="header-note">Plant health, made clear</span>
  </header>
  <main>{% block body %}{% endblock %}</main>
  <footer>LeafLens is an educational aid — confirm treatment choices with a local agricultural expert.</footer>
  <script src="{{ url_for('static', filename='client.js') }}" defer></script>
</body>
</html>
